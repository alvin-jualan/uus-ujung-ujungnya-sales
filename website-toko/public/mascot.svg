<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Soft Background Radial -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2EEF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Bunny Fur Gradient -->
    <linearGradient id="bunnyFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#ECE5DA"/>
    </linearGradient>

    <!-- Ear Blush Gradient -->
    <linearGradient id="innerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EADBEE"/>
      <stop offset="100%" stop-color="#CBB7DC"/>
    </linearGradient>

    <!-- Glasses Metallic Purple Gradient -->
    <linearGradient id="glassesFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#735D8A"/>
      <stop offset="100%" stop-color="#4E3B61"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#735D8A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="185" fill="url(#haloGlow)"/>

  <g filter="url(#softShadow)">
    <!-- LEFT EAR -->
    <g transform="rotate(-10 135 150)">
      <path d="M 110,180 C 70,120 75,30 130,20 C 165,15 170,90 155,180 Z" fill="url(#bunnyFur)" stroke="#DDD6C9" stroke-width="3"/>
      <!-- Inner Ear -->
      <path d="M 115,160 C 90,110 95,45 130,38 C 150,35 152,90 142,160 Z" fill="url(#innerEar)"/>
    </g>

    <!-- RIGHT EAR (Slightly tilted / playful flop) -->
    <g transform="rotate(12 265 150)">
      <path d="M 245,180 C 230,90 235,15 270,20 C 325,30 330,120 290,180 Z" fill="url(#bunnyFur)" stroke="#DDD6C9" stroke-width="3"/>
      <!-- Inner Ear -->
      <path d="M 258,160 C 248,90 250,35 270,38 C 305,45 310,110 285,160 Z" fill="url(#innerEar)"/>
    </g>

    <!-- HEAD -->
    <ellipse cx="200" cy="235" rx="105" ry="92" fill="url(#bunnyFur)" stroke="#DDD6C9" stroke-width="3.5"/>

    <!-- CHEEK FLUFF -->
    <path d="M 96,245 C 80,240 75,255 88,262 C 78,268 85,280 102,274" fill="none" stroke="#DDD6C9" stroke-width="3" stroke-linecap="round"/>
    <path d="M 304,245 C 320,240 325,255 312,262 C 322,268 315,280 298,274" fill="none" stroke="#DDD6C9" stroke-width="3" stroke-linecap="round"/>

    <!-- CHEEK BLUSH (Cute subtle purple mist blush) -->
    <ellipse cx="132" cy="262" rx="18" ry="10" fill="#EBDCF0" opacity="0.8"/>
    <ellipse cx="268" cy="262" rx="18" ry="10" fill="#EBDCF0" opacity="0.8"/>

    <!-- EYES (Hazy / Cozy relaxed look) -->
    <!-- Left Eye -->
    <ellipse cx="152" cy="225" rx="9" ry="11" fill="#18171A"/>
    <circle cx="155" cy="221" r="3.5" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="248" cy="225" rx="9" ry="11" fill="#18171A"/>
    <circle cx="251" cy="221" r="3.5" fill="#FFFFFF"/>

    <!-- GLASSES (Round oversized frames) -->
    <!-- Left Lens Rim -->
    <circle cx="152" cy="226" r="34" fill="#FAF8F5" fill-opacity="0.3" stroke="url(#glassesFrame)" stroke-width="4.5"/>
    <!-- Left Lens Glass Glint -->
    <path d="M 132,204 Q 160,208 170,224" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- Right Lens Rim -->
    <circle cx="248" cy="226" r="34" fill="#FAF8F5" fill-opacity="0.3" stroke="url(#glassesFrame)" stroke-width="4.5"/>
    <!-- Right Lens Glass Glint -->
    <path d="M 228,204 Q 256,208 266,224" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

    <!-- Bridge Between Glasses -->
    <path d="M 186,222 Q 200,216 214,222" fill="none" stroke="url(#glassesFrame)" stroke-width="4" stroke-linecap="round"/>
    <!-- Frame Temples / Sides -->
    <path d="M 118,225 L 98,220" fill="none" stroke="url(#glassesFrame)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 282,225 L 302,220" fill="none" stroke="url(#glassesFrame)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- CUTE NOSE -->
    <path d="M 195,250 C 195,246 205,246 205,250 L 202,256 C 201,258 199,258 198,256 Z" fill="#9D84B7"/>

    <!-- CUTE MOUTH -->
    <path d="M 200,257 L 200,265" fill="none" stroke="#65626A" stroke-width="2" stroke-linecap="round"/>
    <path d="M 190,266 Q 200,273 200,265 Q 200,273 210,266" fill="none" stroke="#65626A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- TINY HEAD ACCENT (Floating little purple star / spark) -->
    <g transform="translate(295, 140)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#735D8A"/>
    </g>
  </g>
</svg>
