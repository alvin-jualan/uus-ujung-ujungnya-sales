<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="tumblerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>
    <linearGradient id="matteTumbler" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#846E9B"/>
      <stop offset="35%" stop-color="#9C85B3"/>
      <stop offset="70%" stop-color="#735D8A"/>
      <stop offset="100%" stop-color="#554269"/>
    </linearGradient>
    <linearGradient id="steelLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D3A42"/>
      <stop offset="50%" stop-color="#5A5562"/>
      <stop offset="100%" stop-color="#2D2A32"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#tumblerBgGrad)"/>
  <circle cx="300" cy="380" r="210" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Tumbler Vector -->
  <g filter="url(#softShadow)" transform="translate(0, 40)">
    <!-- Insulated Lid -->
    <rect x="235" y="110" width="130" height="40" rx="8" fill="url(#steelLid)" stroke="#222026" stroke-width="1.5"/>
    <rect x="250" y="96" width="100" height="18" rx="6" fill="#25232A"/>
    <rect x="285" y="86" width="30" height="12" rx="4" fill="#735D8A"/>

    <!-- Tumbler Body -->
    <path d="M 230,150 L 370,150 L 350,560 C 350,575 340,580 325,580 L 275,580 C 260,580 250,575 250,560 Z" fill="url(#matteTumbler)" stroke="#524065" stroke-width="2"/>

    <!-- Laser Engraved hazy-bnuy Mascot with Glasses -->
    <g transform="translate(300, 310) scale(0.6)">
      <path d="M -16,-30 C -30,-58 -22,-80 -5,-76 C 8,-74 5,-45 0,-30 Z" fill="none" stroke="#FAF7F2" stroke-width="2.5"/>
      <path d="M 16,-30 C 5,-58 10,-80 25,-76 C 35,-72 30,-45 20,-30 Z" fill="none" stroke="#FAF7F2" stroke-width="2.5"/>
      <ellipse cx="0" cy="0" rx="35" ry="30" fill="none" stroke="#FAF7F2" stroke-width="2.5"/>
      <circle cx="-13" cy="-2" r="12" fill="none" stroke="#FAF7F2" stroke-width="2.5"/>
      <circle cx="13" cy="-2" r="12" fill="none" stroke="#FAF7F2" stroke-width="2.5"/>
      <line x1="-1" y1="-2" x2="1" y2="-2" stroke="#FAF7F2" stroke-width="2"/>
      <circle cx="-13" cy="-2" r="3" fill="#FAF7F2"/>
      <circle cx="13" cy="-2" r="3" fill="#FAF7F2"/>
      <polygon points="-2,7 2,7 0,10" fill="#FAF7F2"/>
      <path d="M -5,13 Q 0,16 0,13 Q 0,16 5,13" fill="none" stroke="#FAF7F2" stroke-width="2" stroke-linecap="round"/>
    </g>

    <text x="300" y="380" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#F4EFE6" letter-spacing="4" text-anchor="middle">hazy-bnuy</text>
    <text x="300" y="540" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#D9CCE8" letter-spacing="1" text-anchor="middle">550ML // 18/8 STEEL</text>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-65" cy="0" r="4" fill="#735D8A"/>
    <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">BNUY TUMBLER</text>
  </g>
</svg>
