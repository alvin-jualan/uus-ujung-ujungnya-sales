<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="toteBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#toteBgGrad)"/>
  <circle cx="300" cy="380" r="210" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Canvas Tote Bag -->
  <g filter="url(#softShadow)" transform="translate(0, 30)">
    <!-- Straps -->
    <path d="M 230,270 L 230,110 C 230,70 270,60 300,60 C 330,60 370,70 370,110 L 370,270" fill="none" stroke="#68557C" stroke-width="16" stroke-linecap="round"/>
    <path d="M 230,270 L 230,110 C 230,70 270,60 300,60 C 330,60 370,70 370,110 L 370,270" fill="none" stroke="#7E6894" stroke-width="12" stroke-linecap="round"/>

    <!-- Bag Main Body -->
    <rect x="170" y="240" width="260" height="340" rx="14" fill="#F8F4EC" stroke="#DCD5C6" stroke-width="2"/>
    
    <!-- Top Fold / Rim -->
    <path d="M 170,240 L 430,240 L 430,270 L 170,270 Z" fill="#EFE8DC" stroke="#D3CCC0" stroke-width="1.5"/>

    <!-- Center Hazy Bnuy Graphic Print -->
    <g transform="translate(300, 395)">
      <rect x="-85" y="-85" width="170" height="175" rx="12" fill="#F3EDE2" stroke="#DDD5C6" stroke-width="1"/>
      
      <!-- Bnuy Mascot inside frame -->
      <g transform="translate(0, -15) scale(0.6)">
        <path d="M -16,-30 C -30,-58 -22,-80 -5,-76 C 8,-74 5,-45 0,-30 Z" fill="#FFFFFF" stroke="#735D8A" stroke-width="2.5"/>
        <path d="M 16,-30 C 5,-58 10,-80 25,-76 C 35,-72 30,-45 20,-30 Z" fill="#FFFFFF" stroke="#735D8A" stroke-width="2.5"/>
        <ellipse cx="0" cy="0" rx="35" ry="30" fill="#FFFFFF" stroke="#735D8A" stroke-width="3"/>
        <circle cx="-13" cy="-2" r="12" fill="#FAF8F5" fill-opacity="0.5" stroke="#735D8A" stroke-width="3"/>
        <circle cx="13" cy="-2" r="12" fill="#FAF8F5" fill-opacity="0.5" stroke="#735D8A" stroke-width="3"/>
        <line x1="-1" y1="-2" x2="1" y2="-2" stroke="#735D8A" stroke-width="2.5"/>
        <circle cx="-13" cy="-2" r="3.5" fill="#18171A"/>
        <circle cx="13" cy="-2" r="3.5" fill="#18171A"/>
        <polygon points="-2,7 2,7 0,10" fill="#735D8A"/>
        <path d="M -5,13 Q 0,16 0,13 Q 0,16 5,13" fill="none" stroke="#735D8A" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#18171A" letter-spacing="2" text-anchor="middle">hazy-bnuy</text>
      <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#735D8A" letter-spacing="3" text-anchor="middle">DUCK CANVAS // 24 OZ</text>
      <text x="0" y="70" font-family="sans-serif" font-size="7" font-weight="500" fill="#65626A" letter-spacing="1" text-anchor="middle">NATURAL BONE EDITION</text>
    </g>

    <!-- Side woven purple label -->
    <rect x="428" y="320" width="12" height="26" rx="2" fill="#735D8A"/>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-65" cy="0" r="4" fill="#735D8A"/>
    <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">BNUY CANVAS TOTE</text>
  </g>
</svg>
