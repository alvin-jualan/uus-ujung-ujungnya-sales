<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)"/>
  
  <circle cx="300" cy="380" r="220" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="300" cy="380" r="160" fill="none" stroke="#735D8A" stroke-width="1" opacity="0.15"/>

  <!-- Hoodie Vector -->
  <g filter="url(#softShadow)" transform="translate(0, 30)">
    <!-- Body -->
    <path d="M 210,170 C 250,185 350,185 390,170 L 460,240 L 415,310 L 375,270 L 385,550 C 385,565 370,575 355,575 L 245,575 C 230,575 215,565 215,550 L 225,270 L 185,310 L 140,240 Z" fill="#F8F5EE" stroke="#DCD6C9" stroke-width="2"/>
    
    <!-- Outer Hood -->
    <path d="M 210,170 C 210,95 240,65 300,65 C 360,65 390,95 390,170 C 350,210 250,210 210,170 Z" fill="#FDFCF9" stroke="#D6D0C2" stroke-width="2"/>
    
    <!-- Inner Hood -->
    <path d="M 240,165 C 245,115 265,95 300,95 C 335,95 355,115 360,165 C 340,190 260,190 240,165 Z" fill="#EDE6DA"/>
    
    <!-- Drawstrings -->
    <path d="M 280,180 Q 280,260 270,300" fill="none" stroke="#735D8A" stroke-width="3" stroke-linecap="round"/>
    <path d="M 320,180 Q 320,260 330,290" fill="none" stroke="#735D8A" stroke-width="3" stroke-linecap="round"/>
    <rect x="267" y="300" width="6" height="14" rx="2" fill="#5D4972"/>
    <rect x="327" y="290" width="6" height="14" rx="2" fill="#5D4972"/>

    <!-- Kangaroo Pocket -->
    <path d="M 245,430 L 355,430 L 370,505 C 370,515 360,520 350,520 L 250,520 C 240,520 230,515 230,505 Z" fill="#F2ECE1" stroke="#DCD5C6" stroke-width="1.5"/>

    <!-- hazy-bnuy Mascot Embroidery on Chest! -->
    <g transform="translate(260, 245) scale(0.38)">
      <!-- Mini Bunny with Glasses -->
      <circle cx="0" cy="0" r="30" fill="#F2EEF6" stroke="#735D8A" stroke-width="1.5"/>
      <!-- Ears -->
      <path d="M -12,-20 C -20,-38 -15,-52 -5,-50 C 2,-48 0,-30 -3,-20 Z" fill="#FAF8F5" stroke="#735D8A" stroke-width="1.8"/>
      <path d="M 12,-20 C 5,-38 10,-52 18,-50 C 24,-48 20,-30 15,-20 Z" fill="#FAF8F5" stroke="#735D8A" stroke-width="1.8"/>
      <!-- Face -->
      <ellipse cx="0" cy="0" rx="20" ry="17" fill="#FAF8F5" stroke="#735D8A" stroke-width="1.8"/>
      <!-- Round Glasses -->
      <circle cx="-8" cy="-2" r="7.5" fill="none" stroke="#735D8A" stroke-width="2"/>
      <circle cx="8" cy="-2" r="7.5" fill="none" stroke="#735D8A" stroke-width="2"/>
      <line x1="-1" y1="-2" x2="1" y2="-2" stroke="#735D8A" stroke-width="2"/>
      <!-- Eyes & Nose -->
      <circle cx="-8" cy="-2" r="2" fill="#18171A"/>
      <circle cx="8" cy="-2" r="2" fill="#18171A"/>
      <polygon points="-1.5,4 1.5,4 0,6" fill="#735D8A"/>
    </g>
    
    <!-- Bottom Hem Ribbing -->
    <line x1="218" y1="550" x2="382" y2="550" stroke="#DDD7CB" stroke-width="2" stroke-dasharray="2 3"/>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-65" cy="0" r="4" fill="#735D8A"/>
    <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">HAZY-BNUY 480GSM</text>
  </g>
</svg>
