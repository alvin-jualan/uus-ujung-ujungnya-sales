<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="mugBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>
    <linearGradient id="ceramicGlaze" x1="0%" y1="0%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="40%" stop-color="#F4EFE7"/>
      <stop offset="80%" stop-color="#EAE3D7"/>
      <stop offset="100%" stop-color="#DDCFC1"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#mugBgGrad)"/>
  <circle cx="300" cy="380" r="210" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Mug & Coaster Vector -->
  <g filter="url(#softShadow)" transform="translate(0, 100)">
    <!-- Coaster Base -->
    <ellipse cx="280" cy="460" rx="160" ry="24" fill="#E8E2D7" stroke="#CEC6B8" stroke-width="2"/>
    <ellipse cx="280" cy="456" rx="150" ry="20" fill="#735D8A" fill-opacity="0.15"/>

    <!-- Handle -->
    <path d="M 370,240 C 470,240 470,390 370,390" fill="none" stroke="#E8E2D7" stroke-width="32" stroke-linecap="round"/>
    <path d="M 370,240 C 470,240 470,390 370,390" fill="none" stroke="#FAF7F2" stroke-width="24" stroke-linecap="round"/>

    <!-- Ceramic Mug Body -->
    <path d="M 180,210 L 380,210 L 370,440 C 370,455 350,465 330,465 L 230,465 C 210,465 190,455 190,440 Z" fill="url(#ceramicGlaze)" stroke="#CEC6B8" stroke-width="2"/>

    <!-- Rim ellipse -->
    <ellipse cx="280" cy="210" rx="100" ry="16" fill="#FDFBF9" stroke="#CEC6B8" stroke-width="2"/>
    <ellipse cx="280" cy="212" rx="90" ry="12" fill="#735D8A" fill-opacity="0.2"/>

    <!-- Stamped hazy-bnuy with round glasses on mug -->
    <g transform="translate(280, 325) scale(0.48)">
      <circle cx="0" cy="0" r="34" fill="#F4EEF8" stroke="#735D8A" stroke-width="2"/>
      <path d="M -12,-20 C -20,-38 -15,-52 -5,-50 C 2,-48 0,-30 -3,-20 Z" fill="#FAF8F5" stroke="#735D8A" stroke-width="2"/>
      <path d="M 12,-20 C 5,-38 10,-52 18,-50 C 24,-48 20,-30 15,-20 Z" fill="#FAF8F5" stroke="#735D8A" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="22" ry="19" fill="#FAF8F5" stroke="#735D8A" stroke-width="2"/>
      <circle cx="-9" cy="-2" r="8" fill="none" stroke="#735D8A" stroke-width="2"/>
      <circle cx="9" cy="-2" r="8" fill="none" stroke="#735D8A" stroke-width="2"/>
      <line x1="-1" y1="-2" x2="1" y2="-2" stroke="#735D8A" stroke-width="2"/>
      <circle cx="-9" cy="-2" r="2.5" fill="#18171A"/>
      <circle cx="9" cy="-2" r="2.5" fill="#18171A"/>
    </g>
    <text x="280" y="375" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#735D8A" letter-spacing="2" text-anchor="middle">hazy-bnuy</text>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-65" cy="0" r="4" fill="#735D8A"/>
    <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">BNUY CERAMIC MUG</text>
  </g>
</svg>
