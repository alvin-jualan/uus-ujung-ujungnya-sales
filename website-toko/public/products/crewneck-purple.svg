<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="crewBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>
    <linearGradient id="violetFabric" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#8E78A4"/>
      <stop offset="60%" stop-color="#735D8A"/>
      <stop offset="100%" stop-color="#58456C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#crewBgGrad)"/>
  <circle cx="300" cy="380" r="210" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Crewneck Vector -->
  <g filter="url(#softShadow)" transform="translate(0, 50)">
    <path d="M 230,120 C 265,135 335,135 370,120 L 475,230 L 430,295 L 385,250 L 385,530 C 385,545 375,555 360,555 L 240,555 C 225,555 215,545 215,530 L 215,250 L 170,295 L 125,230 Z" fill="url(#violetFabric)" stroke="#523E66" stroke-width="2"/>
    
    <!-- Thick Rib Collar -->
    <path d="M 235,123 C 265,145 335,145 365,123 C 350,105 250,105 235,123 Z" fill="#6B5581" stroke="#4E3A60" stroke-width="2"/>

    <!-- Left Chest Embroidered hazy-bnuy with glasses Patch -->
    <g transform="translate(265, 235) scale(0.35)">
      <circle cx="0" cy="0" r="32" fill="#FAF8F5" stroke="#4E3A60" stroke-width="2"/>
      <path d="M -12,-18 C -18,-34 -14,-46 -5,-44 C 1,-42 0,-26 -2,-18 Z" fill="#FFFFFF" stroke="#735D8A" stroke-width="2"/>
      <path d="M 12,-18 C 6,-34 10,-46 17,-44 C 23,-42 19,-26 14,-18 Z" fill="#FFFFFF" stroke="#735D8A" stroke-width="2"/>
      <ellipse cx="0" cy="2" rx="20" ry="17" fill="#FFFFFF" stroke="#735D8A" stroke-width="2"/>
      <circle cx="-8" cy="0" r="7" fill="none" stroke="#735D8A" stroke-width="2"/>
      <circle cx="8" cy="0" r="7" fill="none" stroke="#735D8A" stroke-width="2"/>
      <line x1="-1" y1="0" x2="1" y2="0" stroke="#735D8A" stroke-width="2"/>
      <circle cx="-8" cy="0" r="2" fill="#18171A"/>
      <circle cx="8" cy="0" r="2" fill="#18171A"/>
      <polygon points="-1.5,5 1.5,5 0,7" fill="#735D8A"/>
    </g>

    <!-- Ribbed Cuffs and Hem -->
    <line x1="216" y1="535" x2="384" y2="535" stroke="#4E3A60" stroke-width="3"/>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-75" cy="0" r="4" fill="#735D8A"/>
    <text x="-62" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">BNUY CREST CREWNECK</text>
  </g>
</svg>
