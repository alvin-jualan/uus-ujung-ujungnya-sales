<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="capBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#capBgGrad)"/>
  <circle cx="300" cy="380" r="210" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Dad Cap Vector -->
  <g filter="url(#softShadow)" transform="translate(0, 120)">
    <!-- Crown Dome -->
    <path d="M 180,310 C 180,180 230,130 300,130 C 370,130 420,180 420,310 Z" fill="#2E2C33" stroke="#1D1A21" stroke-width="2"/>
    
    <!-- Crown Seam Lines -->
    <path d="M 300,130 L 300,310" stroke="#3E3A45" stroke-width="2"/>
    <path d="M 300,130 Q 230,220 200,310" fill="none" stroke="#3E3A45" stroke-width="1.5"/>
    <path d="M 300,130 Q 370,220 400,310" fill="none" stroke="#3E3A45" stroke-width="1.5"/>

    <!-- Eyelets -->
    <circle cx="260" cy="210" r="4" fill="#1C1A20" stroke="#484450" stroke-width="1"/>
    <circle cx="340" cy="210" r="4" fill="#1C1A20" stroke="#484450" stroke-width="1"/>

    <!-- Top Button -->
    <circle cx="300" cy="130" r="9" fill="#242129" stroke="#1B191F" stroke-width="1.5"/>

    <!-- Curved Visor / Brim -->
    <path d="M 170,305 C 190,380 410,380 430,305 C 445,340 375,395 300,395 C 225,395 155,340 170,305 Z" fill="#25222A" stroke="#18161D" stroke-width="2"/>

    <!-- Embroidered hazy-bnuy mascot with round glasses -->
    <g transform="translate(300, 245) scale(0.42)">
      <circle cx="0" cy="0" r="28" fill="#F4EEF8" stroke="#9D84B7" stroke-width="2"/>
      <path d="M -10,-16 C -16,-30 -12,-42 -4,-40 C 2,-38 0,-24 -2,-16 Z" fill="#FFFFFF" stroke="#9D84B7" stroke-width="2"/>
      <path d="M 10,-16 C 4,-30 8,-42 16,-40 C 22,-38 18,-24 13,-16 Z" fill="#FFFFFF" stroke="#9D84B7" stroke-width="2"/>
      <ellipse cx="0" cy="2" rx="18" ry="15" fill="#FFFFFF" stroke="#9D84B7" stroke-width="2"/>
      <circle cx="-7" cy="0" r="6" fill="none" stroke="#9D84B7" stroke-width="2"/>
      <circle cx="7" cy="0" r="6" fill="none" stroke="#9D84B7" stroke-width="2"/>
      <line x1="-1" y1="0" x2="1" y2="0" stroke="#9D84B7" stroke-width="2"/>
      <circle cx="-7" cy="0" r="2" fill="#18171A"/>
      <circle cx="7" cy="0" r="2" fill="#18171A"/>
    </g>
    <text x="300" y="278" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#B29BCC" letter-spacing="2" text-anchor="middle">hazy-bnuy</text>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-65" cy="0" r="4" fill="#735D8A"/>
    <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">BNUY DAD CAP</text>
  </g>
</svg>
