<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="teeBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2ECE2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#735D8A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#teeBgGrad)"/>
  <circle cx="300" cy="380" r="210" fill="none" stroke="#E2DDD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Boxy Tee Vector -->
  <g filter="url(#softShadow)" transform="translate(0, 70)">
    <!-- Main Body and Boxy Sleeves -->
    <path d="M 225,120 C 265,135 335,135 375,120 L 485,185 L 445,260 L 390,225 L 390,510 L 210,510 L 210,225 L 155,260 L 115,185 Z" fill="#FAF7F1" stroke="#DDD7CC" stroke-width="2"/>
    
    <!-- Thick Ribbed Collar -->
    <path d="M 235,123 C 265,145 335,145 365,123 C 350,110 250,110 235,123 Z" fill="#EFE8DC" stroke="#D3CDC0" stroke-width="2"/>

    <!-- Mascot Graphic Center/Chest -->
    <g transform="translate(300, 290) scale(0.65)">
      <!-- Bunny with Round Glasses Illustration on Tee -->
      <path d="M -16,-30 C -30,-58 -22,-80 -5,-76 C 8,-74 5,-45 0,-30 Z" fill="#FFFFFF" stroke="#735D8A" stroke-width="2.5"/>
      <path d="M -16,-30 C -25,-55 -18,-72 -6,-70 C 2,-68 1,-45 -2,-30 Z" fill="#EADBEE"/>

      <path d="M 16,-30 C 5,-58 10,-80 25,-76 C 35,-72 30,-45 20,-30 Z" fill="#FFFFFF" stroke="#735D8A" stroke-width="2.5"/>
      <path d="M 16,-30 C 8,-55 12,-72 23,-70 C 29,-68 25,-45 18,-30 Z" fill="#EADBEE"/>

      <ellipse cx="0" cy="0" rx="35" ry="30" fill="#FFFFFF" stroke="#735D8A" stroke-width="3"/>
      <!-- Cheek Blush -->
      <circle cx="-20" cy="8" r="5" fill="#EADBEE"/>
      <circle cx="20" cy="8" r="5" fill="#EADBEE"/>
      <!-- Eyes & Round Glasses -->
      <circle cx="-13" cy="-2" r="12" fill="#FAF8F5" fill-opacity="0.5" stroke="#735D8A" stroke-width="3"/>
      <circle cx="13" cy="-2" r="12" fill="#FAF8F5" fill-opacity="0.5" stroke="#735D8A" stroke-width="3"/>
      <line x1="-1" y1="-2" x2="1" y2="-2" stroke="#735D8A" stroke-width="2.5"/>
      <circle cx="-13" cy="-2" r="3.5" fill="#18171A"/>
      <circle cx="13" cy="-2" r="3.5" fill="#18171A"/>
      <circle cx="-11" cy="-3.5" r="1" fill="#FFFFFF"/>
      <circle cx="15" cy="-3.5" r="1" fill="#FFFFFF"/>
      <!-- Nose & Mouth -->
      <polygon points="-2,7 2,7 0,10" fill="#735D8A"/>
      <path d="M -5,13 Q 0,16 0,13 Q 0,16 5,13" fill="none" stroke="#735D8A" stroke-width="2" stroke-linecap="round"/>

      <!-- Graphic Typography -->
      <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#735D8A" letter-spacing="3" text-anchor="middle">HAZY-BNUY</text>
      <text x="0" y="70" font-family="sans-serif" font-size="8" font-weight="600" fill="#65626A" letter-spacing="2" text-anchor="middle">READING CLUB // 2026</text>
    </g>
    
    <!-- Raw Hem Stitch Accent -->
    <line x1="210" y1="504" x2="390" y2="504" stroke="#735D8A" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.4"/>
  </g>

  <!-- Clean Floating Badge -->
  <g transform="translate(300, 680)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2DDD3" stroke-width="1"/>
    <circle cx="-65" cy="0" r="4" fill="#735D8A"/>
    <text x="-52" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#18171A" letter-spacing="1">BNUY BOXY TEE</text>
  </g>
</svg>
