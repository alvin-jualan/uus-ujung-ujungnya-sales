<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>
    <linearGradient id="iconGlasses" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#735D8A"/>
      <stop offset="100%" stop-color="#55416A"/>
    </linearGradient>
  </defs>

  <!-- Left Ear -->
  <path d="M 32,45 C 22,25 25,6 38,4 C 47,3 48,20 44,45 Z" fill="url(#iconFur)" stroke="#D8D0C3" stroke-width="1.8"/>
  <path d="M 33,38 C 28,26 29,12 37,10 C 42,9 43,22 40,38 Z" fill="#E8DBEE"/>

  <!-- Right Ear -->
  <path d="M 66,45 C 62,20 63,3 72,4 C 85,6 88,25 78,45 Z" fill="url(#iconFur)" stroke="#D8D0C3" stroke-width="1.8"/>
  <path d="M 69,38 C 66,22 67,9 72,10 C 80,12 81,26 76,38 Z" fill="#E8DBEE"/>

  <!-- Head -->
  <ellipse cx="50" cy="62" rx="32" ry="28" fill="url(#iconFur)" stroke="#D8D0C3" stroke-width="2"/>

  <!-- Blush -->
  <circle cx="28" cy="70" r="5" fill="#EAD8F0" opacity="0.9"/>
  <circle cx="72" cy="70" r="5" fill="#EAD8F0" opacity="0.9"/>

  <!-- Eyes -->
  <circle cx="36" cy="60" r="3" fill="#18171A"/>
  <circle cx="37" cy="59" r="1" fill="#FFFFFF"/>
  <circle cx="64" cy="60" r="3" fill="#18171A"/>
  <circle cx="65" cy="59" r="1" fill="#FFFFFF"/>

  <!-- Round Glasses -->
  <circle cx="36" cy="60" r="11" fill="none" stroke="url(#iconGlasses)" stroke-width="2.2"/>
  <circle cx="64" cy="60" r="11" fill="none" stroke="url(#iconGlasses)" stroke-width="2.2"/>
  <line x1="47" y1="59" x2="53" y2="59" stroke="url(#iconGlasses)" stroke-width="2"/>

  <!-- Nose & Mouth -->
  <polygon points="48,68 52,68 50,71" fill="#8E74A5"/>
  <path d="M 46,74 Q 50,77 50,74 Q 50,77 54,74" fill="none" stroke="#65626A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
